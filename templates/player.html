<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>PW Video Player</title>

<!-- Shaka Player (Google's production-grade DASH/HLS player) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>

<style>
/* ── Reset ── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
}

/* ── Player shell ── */
.shell {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #000;
}

#video {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
}

/* ── Status overlay ── */
.status {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column;
    align-items: center; gap: 14px;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    text-align: center;
    padding: 0 28px;
    z-index: 20;
    pointer-events: none;
}
.status.hidden { display: none; }
.status.error  { color: rgba(255,80,80,0.9); }

.spinner {
    width: 36px; height: 36px;
    border: 2.5px solid rgba(255,255,255,0.1);
    border-top: 2.5px solid rgba(255,255,255,0.55);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.status.error .spinner { display: none; }

/* ── Top-left: quality badge + elapsed ── */
.top-left {
    position: absolute; top: 14px; left: 14px;
    z-index: 10;
    display: flex; flex-direction: column; gap: 5px;
    pointer-events: none;
}
.quality-badge {
    background: rgba(0,0,0,0.72);
    color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 4px;
    border-left: 3px solid #ff6600;
    display: none;
}
.quality-badge.show { display: block; }

.elapsed-badge {
    background: rgba(0,0,0,0.72);
    color: #ccc; font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 4px;
    display: none;
}
.elapsed-badge.show { display: block; }

/* ── Top-right controls ── */
.top-right {
    position: absolute; top: 14px; right: 14px;
    z-index: 10;
    display: flex; gap: 8px;
}
.icon-btn {
    width: 34px; height: 34px;
    background: rgba(0,0,0,0.65);
    color: #fff; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
}
.icon-btn:hover { background: rgba(30,30,30,0.85); }

/* ── Quality selector dropdown ── */
.quality-panel {
    position: absolute; top: 56px; right: 14px;
    z-index: 30;
    background: rgba(15,15,15,0.96);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 8px 0;
    min-width: 150px;
    display: none;
    backdrop-filter: blur(10px);
}
.quality-panel.open { display: block; }
.quality-panel h4 {
    color: rgba(255,255,255,0.4);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 4px 14px 8px;
}
.q-item {
    padding: 8px 14px;
    color: rgba(255,255,255,0.75);
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: background 0.1s;
}
.q-item:hover { background: rgba(255,255,255,0.06); }
.q-item.active { color: #ff6600; }
.q-item .q-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
}

/* ── Go Live / Skip Live button ── */
.go-live-btn {
    position: absolute; right: 14px; bottom: 58px;
    z-index: 10;
    display: none; align-items: center; gap: 6px;
    background: #e53935; color: #fff;
    border: none; border-radius: 999px;
    padding: 7px 16px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.4px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(229,57,53,0.45);
    animation: none;
}
.go-live-btn.show { display: flex; }
.go-live-btn .gdot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #fff;
    animation: spin2 1s ease-in-out infinite;
}
@keyframes spin2 { 50% { opacity: 0.2; } }

/* ── Progress bar (custom thin bar at very bottom) ── */
video::-webkit-media-controls-enclosure { border-radius: 0; }

/* ── Error info box ── */
.err-detail {
    font-size: 11px; color: rgba(255,120,120,0.7);
    max-width: 280px; line-height: 1.5; margin-top: 4px;
}
</style>
</head>
<body>

<div class="shell" id="shell">

    <!-- Loading / Error -->
    <div class="status" id="status">
        <div class="spinner" id="spinner"></div>
        <div id="statusText">Loading stream...</div>
        <div class="err-detail" id="errDetail"></div>
    </div>

    <!-- Top-left info badges -->
    <div class="top-left">
        <div class="quality-badge" id="qualBadge">AUTO</div>
        <div class="elapsed-badge" id="elapsedBadge">00:00</div>
    </div>

    <!-- Top-right buttons -->
    <div class="top-right">
        <button class="icon-btn" id="qualBtn" title="Quality">⚙</button>
        <button class="icon-btn" id="fsBtn"   title="Fullscreen">⛶</button>
    </div>

    <!-- Quality panel -->
    <div class="quality-panel" id="qualPanel">
        <h4>Quality</h4>
        <div id="qualList"><!-- populated by JS --></div>
    </div>

    <!-- Go Live -->
    <button class="go-live-btn" id="goLiveBtn">
        <span class="gdot"></span>GO LIVE
    </button>

    <video id="video" controls autoplay playsinline></video>
</div>

<script src="{{ url_for('static', filename='js/player.js') }}"></script>
</body>
</html>
